services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://sivamart:sivamart_dev_password@db:5432/sivamart
      JWT_SECRET: ${JWT_SECRET:-change_this_before_deploying}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sivamart
      POSTGRES_USER: sivamart
      POSTGRES_PASSWORD: sivamart_dev_password
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivamart -d sivamart"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
